<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings / Integrations</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: #f5f7fb;
        color: #14213d;
      }
      .container {
        max-width: 900px;
        margin: 40px auto;
        padding: 24px;
      }
      .card {
        background: #fff;
        border-radius: 14px;
        padding: 20px;
        box-shadow: 0 10px 30px rgba(20, 33, 61, 0.08);
        margin-bottom: 16px;
      }
      .header { display: flex; justify-content: space-between; align-items: center; }
      .badge {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 999px;
        background: #e8f0ff;
        color: #1d4ed8;
        font-size: 12px;
        font-weight: 700;
      }
      .integration-list { display: grid; gap: 14px; }
      .integration-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 14px 16px;
      }
      .actions a, .actions button {
        text-decoration: none;
        border: none;
        padding: 8px 12px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
      }
      .primary { background: #2563eb; color: #fff; }
      .secondary { background: #f3f4f6; color: #111827; }
      .muted { color: #6b7280; font-size: 13px; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div class="header">
          <div>
            <div class="badge">Settings / Integrations</div>
            <h1>Connected channels</h1>
            <p class="muted">Add or manage third-party integrations for your healthcare CRM.</p>
          </div>
          <div class="actions">
            <a class="secondary" href="./telegram-help.html">Help docs</a>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="integration-list">
          <div class="integration-item">
            <div>
              <strong>WhatsApp Business</strong>
              <div class="muted">Connected via Twilio sandbox</div>
            </div>
            <div class="actions">
              <button class="secondary">Manage</button>
            </div>
          </div>

          <div class="integration-item">
            <div>
              <strong>Telegram</strong>
              <div class="muted">Connect a Telegram bot to send reminders or updates</div>
            </div>
            <div class="actions">
              <a class="primary" href="./telegram-help.html">Connect</a>
            </div>
          </div>

          <div class="integration-item">
            <div>
              <strong>Slack</strong>
              <div class="muted">Notifications for team follow-ups</div>
            </div>
            <div class="actions">
              <button class="secondary">Manage</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
